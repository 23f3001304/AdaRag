# AdaRag infrastructure — Phase 0.2
# Qdrant (hybrid vector store) + Postgres (metadata, feedback, eval runs).
# The API service joins in Phase 0.3. Usage:
#   docker compose up -d     # start in the background
#   docker compose ps        # status / health
#   docker compose down      # stop (named volumes persist data)

services:
  qdrant:
    image: qdrant/qdrant:v1.18.0   # match the qdrant-client minor in uv.lock (client/server must align)
    container_name: adarag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / HTTP API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    # No container healthcheck: the Qdrant image ships no shell/curl for an in-container probe.
    # Readiness is verified from the host (GET /readyz) on bring-up; the API retries on connect (0.3).

  postgres:
    image: postgres:16-alpine
    container_name: adarag-postgres
    restart: unless-stopped
    # Local dev credentials — these match DATABASE_URL in .env.example. Real secrets live in .env.
    environment:
      POSTGRES_USER: adarag
      POSTGRES_PASSWORD: adarag
      POSTGRES_DB: adarag
    ports:
      # Host 5432 is already in use on this machine, so publish on 5433. In-container the API
      # still reaches Postgres at postgres:5432 (internal network, unchanged).
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adarag -d adarag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: adarag-api
    restart: unless-stopped
    environment:
      # In-container service URLs override the host defaults baked into core/config.py.
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: adarag_chunks
      DATABASE_URL: postgresql+asyncpg://adarag:adarag@postgres:5432/adarag
      # The container can't run the host's CLI shims, so it reaches them over the CLI bridge.
      # Start it on the host first:
      #   uv run uvicorn scripts.cli_bridge:app --host 0.0.0.0 --port 8088
      # (Switch these to ollama + OLLAMA_BASE_URL if you'd rather stay fully in-container.)
      LLM_PROVIDER: cli-bridge
      VISION_PROVIDER: cli-bridge
      CLI_BRIDGE_URL: http://host.docker.internal:8088
      # In-container OCR off: the bridge caption already transcribes text, and easyocr's torchvision
      # isn't ABI-matched to our cu128 torch in the image (host OCR still uses easyocr). See BASELINE.
      OCR_PROVIDER: "none"
    # Lets the container resolve the host (for the bridge) on Linux too; Docker Desktop adds it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist downloaded models (bge-m3, reranker) across recreates — fetch them once, not per build.
      - hf_cache:/root/.cache/huggingface
      # Persist uploaded originals across recreates so Files downloads keep working (host-visible).
      - ./data/uploads:/app/data/uploads
    ports:
      - "8000:8000"
    # GPU passthrough (Docker Desktop + WSL2): lets the in-container bge-m3 embedder use the 5080.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  qdrant_storage:
  pg_data:
  hf_cache:   # cached HF model weights (bge-m3, reranker) for the api container

[project]
name = "adaptive-rag"
version = "0.1.0"
description = "Adaptive multimodal RAG: profile every file, route it to the right ingestion path, retrieve over a hybrid index, and self-tune against a cost-aware objective."
readme = "README.md"
requires-python = "==3.12.*"
# Phase 0 deps, added per micro-step so each step's footprint stays legible.
# Still pending: provider SDKs + bge-m3/torch (0.4).
dependencies = [
    # web / api (0.1)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.12",
    # infra clients (0.3)
    "qdrant-client>=1.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # providers (0.4) — latest verified on PyPI 2026-06-04
    "anthropic>=0.69",
    "openai>=2.0",
    "ollama>=0.6",
    # local embeddings: bge-m3 via FlagEmbedding (dense now; sparse in Phase 1). Heavy: pulls torch.
    "FlagEmbedding>=1.4",
    # FlagEmbedding's inference imports its finetune path (transformers TrainingArguments), which
    # needs accelerate — it doesn't declare it, so a clean (Docker) install breaks without this.
    "accelerate>=1.0",
    "torch>=2.8",  # cu128 (Blackwell) index tops out at 2.11.x; 2.12 isn't published for cu128 yet
    "torchvision>=0.21",  # CPU build pinned in [tool.uv.sources] so its nms op ABI-matches cu128 torch
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.8.1",
    "pypdf>=6.12.2",
    "faster-whisper>=1.2.1",
    "easyocr>=1.7.2",  # dedicated local OCR analyzer for images (GPU via the cu128 torch)
    "optuna>=4.0",  # Phase 5: self-tuning search over pipeline knobs (relevance vs latency/cost)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

# This is an application, not a library: uv manages the venv + deps but does not
# build/install the project itself. The repo root is on the import path (WORKDIR in Docker).
[tool.uv]
package = false
# uv 0.11.x managed-Python downloads hit a "minor version link" bug on this Windows host,
# so use a system interpreter only: locally the winget Python 3.12, in Docker the
# python:3.12 base image. Keeps host and container on the same interpreter.
python-preference = "only-system"

# Pull torch from the PyTorch CUDA 12.8 index (cu128) — required for RTX 50-series / Blackwell
# (sm_120). A CUDA build still runs on CPU when no GPU is present, so it's safe everywhere.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# torchvision pinned to the CPU build: its compiled ops (e.g. nms) must be ABI-matched to torch, and
# the cu128 index ships no matching torchvision. The +cpu build registers fine against torch
# 2.11.0+cu128 (it only needs torch's version-matched C++ core) — exactly the combo proven on the
# host. A mismatched torchvision raises "operator torchvision::nms does not exist", which cascades
# through transformers/peft and breaks the bge-m3 import outright.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses callables (File/Depends/Query) in argument defaults by design

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
